<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAB TCF, Advocatenwet &amp; AVG — Analyse en Herstelplan</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --surface-alt: #f3f3f3;
      --text: #111111;
      --muted: #555555;
      --accent: #A31C1C;
      --accent-hover: #7d1414;
      --accent-soft: #fdf2f2;
      --border: #dcdcdc;
      --base-font: 19px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: var(--base-font);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3.5rem;
    }

    /* Topbar */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .back-link:hover,
    .back-link:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
    }

    button {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }

    .btn-accent {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn-accent:hover,
    .btn-accent:focus-visible {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #ffffff;
    }

    /* Header */
    header {
      border-bottom: 3px solid var(--accent);
      padding-bottom: 1.25rem;
      margin-bottom: 2rem;
    }

    .kicker {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    header h1 {
      margin: 0 0 0.6rem;
      font-size: 1.75rem;
      line-height: 1.2;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

      background: var(--surface);
      border: 1px solid var(--border);
