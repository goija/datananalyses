<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentatie &amp; Leeslinks — Index</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --sidebar-bg: #f8f9fa;
            --text-color: #1c1e21;
            --muted-color: #5a626a;
            --accent-color: #A31C1C; /* Zeeuws meekrabrood */
            --accent-soft: #fdf2f2;
            --border-color: #dcdfe4;
            --hover-bg: #f1f3f5;
            --code-bg: #f4f5f7;
            --font-size: 19px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --sidebar-bg: #181a1d;
                --text-color: #e4e6eb;
                --muted-color: #9ba1a6;
                --accent-color: #d64545;
                --accent-soft: #2a1616;
                --border-color: #2e3238;
                --hover-bg: #23272d;
                --code-bg: #1e2126;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            min-height: 100vh;
            line-height: 1.65;
        }

        /* Navigatie / Zijbalk */
        aside {
            width: 320px;
            flex-shrink: 0;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .brand {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .brand h1 {
            font-size: 1.15rem;
            margin: 0;
            color: var(--accent-color);
            letter-spacing: 0.01em;
        }

        .font-controls {
            display: flex;
            gap: 0.25rem;
        }

        .font-controls button {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.2rem 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .font-controls button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .nav-group-title {
            font-size: 0.78rem;
            text-transform: uppercase;
