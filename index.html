<nav aria-label="Repository bestanden">
  <ul id="repo-links">
    <li>Bestanden laden...</li>
  </ul>
</nav>

<script>
(async () => {
  const OWNER = 'goija';
  const REPO = 'datananalyses';
  const EXCLUDE = new Set(['index.html', 'README.md']);
  const CACHE_KEY = `gh_links_${OWNER}_${REPO}`;
  const listEl = document.getElementById('repo-links');

  const render = (files) => {
    listEl.innerHTML = '';
    files.forEach((file) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      const isHtml = file.name.toLowerCase().endsWith('.html');

      // HTML opent direct op je site; Markdown opent opgemaakt op GitHub
      a.href = isHtml ? `./${encodeURIComponent(file.name)}` : file.html_url;
      if (!isHtml) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
      a.textContent = file.name.replace(/\.(md|html)$/i, '');

      li.appendChild(a);
      listEl.appendChild(li);
    });
  };

  try {
    // 5 minuten cache om onder de GitHub API-limiet (60 req/uur) te blijven
    const cached = sessionStorage.getItem(CACHE_KEY);
    if (cached) {
      const { ts, data } = JSON.parse(cached);
      if (Date.now() - ts < 5 * 60 * 1000) {
        render(data);
        return;
      }
    }

    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);
    if (!res.ok) throw new Error(`Status ${res.status}`);

    const items = await res.json();
    const files = items
      .filter((item) =>
        item.type === 'file' &&
        /\.(md|html)$/i.test(item.name) &&
        !EXCLUDE.has(item.name)
      )
      .sort((a, b) => a.name.localeCompare(b.name, 'nl'));

    sessionStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: files }));
    render(files);
  } catch (err) {
    listEl.innerHTML = `<li>Kon bestanden niet laden (${err.message}).</li>`;
  }
})();
</script>
