<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gezamenlijk Verzoekschrift &amp; Collectieve Machtiging — Gemeente Tholen</title>
  <style>
    :root {
      --accent: #8b1e1e; /* Zeeuws meekrab-rood accent */
      --text: #1a1a1a;
      --muted: #555555;
      --border: #cccccc;
      --bg-screen: #f4f4f2;
      --bg-paper: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 11pt;
      line-height: 1.5;
      color: var(--text);
      background-color: var(--bg-screen);
    }

    /* Bedieningsbalk (alleen zichtbaar op scherm) */
    .toolbar {
      max-width: 210mm;
      margin: 0 auto 1.25rem auto;
      padding: 0.75rem 1rem;
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.9rem;
    }

    .toolbar-actions {
      display: flex;
      gap: 0.5rem;
    }

    button {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.875rem;
      padding: 0.45rem 0.9rem;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid var(--accent);
      background: var(--bg-paper);
      color: var(--accent);
      font-weight: 600;
    }

    button.primary {
      background: var(--accent);
      color: #ffffff;
    }

    button:hover {
      opacity: 0.9;
    }

    /* A4 Pagina-opmaak */
    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto 2rem auto;
      padding: 20mm 22mm;
      background: var(--bg-paper);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    header.doc-header {
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.75rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 15pt;
      margin: 0 0 0.25rem 0;
      color: var(--accent);
      letter-spacing: 0.01em;
    }

    h2 {
      font-size: 11.5pt;
      margin: 1.25rem 0 0.4rem 0;
      color: var(--text);
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 0.15rem;
    }

    .subtitle {
      font-size: 9.5pt;
      color: var(--muted);
      margin: 0;
    }

    .address-block {
      margin-bottom: 1.25rem;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 0.25rem 0.75rem;
      margin-bottom: 1.5rem;
      font-size: 10.5pt;
    }

    .meta-label {
      font-weight: bold;
      color: var(--muted);
    }

    /* Invulbare velden */
    .editable {
      display: inline-block;
      min-width: 140px;
      border-bottom: 1px dotted #999999;
      padding: 0 2px;
      color: #000000;
    }

    .editable:focus {
      outline: none;
      background-color: #fff8f8;
      border-bottom: 1px solid var(--accent);
    }

    ul {
      margin: 0.4rem 0 0.8rem 0;
      padding-left: 1.4rem;
    }

    li {
      margin-bottom: 0.35rem;
    }

    .machtiging-box {
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 0.75rem 1rem;
      margin: 0.75rem 0 1rem 0;
      background: #fafafa;
    }

    .signature-footer {
      margin-top: 2rem;
    }

    .sig-line {
      margin-top: 2.5rem;
      width: 240px;
      border-top: 1px solid var(--text);
      padding-top: 0.3rem;
      font-size: 10pt;
    }

    /* Handtekeningentabel (Bijlage 1) */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 9.5pt;
    }

    th, td {
      border: 1px solid #444444;
      padding: 0.45rem 0.5rem;
      text-align: left;
      vertical-align: top;
    }

    th {
      background-color: #f5f5f5;
      font-weight: bold;
      color: var(--text);
    }

    td.row-num {
      width: 32px;
      text-align: center;
      font-weight: bold;
    }

    td.sig-cell {
      height: 44px;
      width: 140px;
    }
